# Integration test profile — runs against a real MySQL 8 service container in CI
# (see .github/workflows/ci-cd.yml, job "spring-boot-test").
# Unlike application-test.properties (H2), this exercises the app against the
# same database engine used in production, catching MySQL-specific issues in
# native @Query methods that H2's MySQL-compatibility mode can miss.

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/stocksense_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root_ci_password

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
logging.level.root=WARN
logging.level.com.stocksense=INFO

server.port=0
app.ai-service.auto-start=false
