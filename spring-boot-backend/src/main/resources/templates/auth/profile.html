<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">
<div class="page-header"><h4><i class="bi bi-person me-2 text-primary"></i>My Profile</h4></div>
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body text-center p-4">
        <div style="width:80px;height:80px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <span style="color:#fff;font-size:2rem;font-weight:700;" th:text="${user != null ? #strings.substring(user.fullName,0,1) : 'U'}">A</span>
        </div>
        <h5 th:text="${user?.fullName ?: 'User'}">Name</h5>
        <p class="text-muted" th:text="'@' + ${user?.username}">@user</p>
        <span th:if="${user?.role?.name == 'ROLE_ADMIN'}" class="badge bg-danger mb-3">Administrator</span>
        <span th:if="${user?.role?.name == 'ROLE_INVENTORY_MANAGER'}" class="badge bg-warning text-dark mb-3">Inventory Manager</span>
        <span th:if="${user?.role?.name == 'ROLE_STAFF'}" class="badge bg-info text-dark mb-3">Staff</span>
        <hr/>
        <div class="text-start">
          <p><strong>Email:</strong> <span th:text="${user?.email}">email</span></p>
          <p><strong>Phone:</strong> <span th:text="${user?.phone ?: '-'}">phone</span></p>
          <p><strong>Status:</strong> <span class="badge bg-success">Active</span></p>
        </div>
      </div>
    </div>
  </div>
</div>
</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
