<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-header">
  <h4><i class="bi bi-box-seam me-2 text-primary"></i>Products</h4>
  <div class="d-flex gap-2">
    <a th:href="@{/products/low-stock}" class="btn btn-outline-warning btn-sm">
      <i class="bi bi-exclamation-triangle me-1"></i>Low Stock
      <span class="badge bg-warning text-dark ms-1" th:text="${lowStockCount}">0</span>
    </a>
    <a th:href="@{/products/create}" class="btn btn-primary btn-sm" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
      <i class="bi bi-plus-lg me-1"></i>Add Product
    </a>
  </div>
</div>

<!-- Search -->
<div class="card mb-3">
  <div class="card-body py-2">
    <form method="get" th:action="@{/products}" class="d-flex gap-2">
      <input type="text" name="keyword" class="form-control form-control-sm" placeholder="Search by name, SKU or barcode..." th:value="${keyword}"/>
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i></button>
      <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x"></i></a>
    </form>
  </div>
</div>

<!-- Products Table -->
<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Product</th>
            <th>SKU</th>
            <th>Category</th>
            <th>Supplier</th>
            <th>Buy Price</th>
            <th>Sell Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${products.isEmpty()}">
            <td colspan="10" class="text-center py-4 text-muted">No products found.</td>
          </tr>
          <tr th:each="p : ${products.content}">
            <td th:text="${p.id}"></td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div style="width:36px;height:36px;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                  <img th:if="${p.imagePath}" th:src="@{'/'+${p.imagePath}}" style="width:36px;height:36px;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'"/>
                  <i th:unless="${p.imagePath}" class="bi bi-box text-secondary"></i>
                </div>
                <div>
                  <div style="font-weight:600;font-size:.88rem;" th:text="${p.name}">Name</div>
                  <small class="text-muted" th:text="${p.unit}">pcs</small>
                </div>
              </div>
            </td>
            <td><code style="font-size:.8rem;" th:text="${p.sku}">SKU</code></td>
            <td th:text="${p.category.name}">Cat</td>
            <td th:text="${p.supplier != null ? p.supplier.name : '-'}">Supplier</td>
            <td th:text="'Rs. ' + ${#numbers.formatDecimal(p.buyingPrice, 0, 'COMMA', 2, 'POINT')}">0</td>
            <td th:text="'Rs. ' + ${#numbers.formatDecimal(p.sellingPrice, 0, 'COMMA', 2, 'POINT')}">0</td>
            <td>
              <span th:classappend="${p.quantity <= p.minStockLevel} ? 'badge bg-danger' : 'badge bg-success'"
                    th:text="${p.quantity}">0</span>
              <small class="text-muted d-block" th:text="'Min: ' + ${p.minStockLevel}"></small>
            </td>
            <td>
              <span th:classappend="${p.isActive} ? 'badge bg-success' : 'badge bg-secondary'"
                    th:text="${p.isActive} ? 'Active' : 'Inactive'">Active</span>
            </td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{'/products/view/' + ${p.id}}" class="btn btn-sm btn-outline-info" title="View">
                  <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{'/products/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary" title="Edit"
                   sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
                  <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{'/products/delete/' + ${p.id}}" method="post" style="display:inline;"
                      sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Delete this product?')">
                  <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <!-- Pagination -->
  <div class="card-footer d-flex justify-content-between align-items-center" th:if="${products.totalPages > 1}">
    <small class="text-muted" th:text="'Showing ' + ${products.numberOfElements} + ' of ' + ${products.totalElements} + ' products'"></small>
    <nav>
      <ul class="pagination pagination-sm mb-0">
        <li th:classappend="${products.first} ? 'page-item disabled' : 'page-item'">
          <a class="page-link" th:href="@{/products(page=${products.number - 1}, keyword=${keyword})}">«</a>
        </li>
        <li th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
            th:classappend="${i == products.number} ? 'page-item active' : 'page-item'">
          <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
        </li>
        <li th:classappend="${products.last} ? 'page-item disabled' : 'page-item'">
          <a class="page-link" th:href="@{/products(page=${products.number + 1}, keyword=${keyword})}">»</a>
        </li>
      </ul>
    </nav>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
