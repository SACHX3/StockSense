<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-header">
  <h4><i class="bi bi-exclamation-triangle me-2 text-warning"></i>Low Stock Alerts</h4>
  <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div th:if="${#lists.isEmpty(products)}" class="card p-5 text-center">
  <i class="bi bi-check-circle text-success" style="font-size:3rem;"></i>
  <h5 class="mt-3 text-success">All products are well stocked!</h5>
  <p class="text-muted">No products are below minimum stock level.</p>
</div>

<div th:unless="${#lists.isEmpty(products)}" class="card">
  <div class="card-header d-flex align-items-center gap-2">
    <i class="bi bi-exclamation-triangle-fill text-warning"></i>
    <span class="badge bg-warning text-dark" th:text="${#lists.size(products)}">0</span>
    products need restocking
  </div>
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead>
        <tr>
          <th style="width:60px;"></th>
          <th>Product</th>
          <th>SKU</th>
          <th>Category</th>
          <th>Supplier</th>
          <th>Current Stock</th>
          <th>Min Level</th>
          <th>Shortfall</th>
          <th sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${products}">
          <!-- Product Image -->
          <td class="text-center" style="vertical-align:middle;">
            <div style="width:42px;height:42px;border-radius:8px;overflow:hidden;
                        background:#f1f5f9;display:flex;align-items:center;
                        justify-content:center;margin:auto;border:1px solid #e2e8f0;">
              <img th:if="${p.imagePath}"
                   th:src="@{'/' + ${p.imagePath}}"
                   style="width:42px;height:42px;object-fit:cover;"
                   onerror="this.parentElement.innerHTML='&lt;i class=&quot;bi bi-box text-secondary&quot; style=&quot;font-size:1.2rem;&quot;&gt;&lt;/i&gt;'"/>
              <i th:unless="${p.imagePath}"
                 class="bi bi-box text-secondary" style="font-size:1.2rem;"></i>
            </div>
          </td>
          <!-- Name + Unit -->
          <td style="vertical-align:middle;">
            <div style="font-weight:600;font-size:.9rem;" th:text="${p.name}">Name</div>
            <small class="text-muted" th:text="${p.unit}">unit</small>
          </td>
          <td style="vertical-align:middle;">
            <code th:text="${p.sku}">SKU</code>
          </td>
          <td style="vertical-align:middle;"
              th:text="${p.category != null ? p.category.name : '-'}">Cat</td>
          <td style="vertical-align:middle;"
              th:text="${p.supplier != null ? p.supplier.name : '-'}">Supplier</td>
          <!-- Current Stock -->
          <td style="vertical-align:middle;">
            <span th:classappend="${p.quantity == 0} ? 'badge bg-danger' : 'badge bg-warning text-dark'"
                  th:text="${p.quantity} + ' ' + ${p.unit}">0</span>
          </td>
          <td style="vertical-align:middle;" th:text="${p.minStockLevel}">10</td>
          <!-- Shortfall -->
          <td style="vertical-align:middle;">
            <span class="text-danger fw-600"
                  th:text="${p.minStockLevel - p.quantity} + ' ' + ${p.unit}">0</span>
          </td>
          <!-- Restock - Admin/Manager only -->
          <td style="vertical-align:middle;"
              sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
            <a th:href="@{'/inventory/adjust?productId=' + ${p.id}}"
               class="btn btn-sm btn-success">
              <i class="bi bi-plus-circle me-1"></i>Restock
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
