<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">
<div class="page-header">
  <h4><i class="bi bi-box-seam me-2 text-primary"></i>Product Details</h4>
  <div class="d-flex gap-2">
    <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-primary btn-sm" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
      <i class="bi bi-pencil me-1"></i>Edit
    </a>
    <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
  </div>
</div>
<div class="row g-3">
  <div class="col-md-4">
    <div class="card text-center p-4">
      <div style="width:100px;height:100px;background:#f1f5f9;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;overflow:hidden;">
        <img th:if="${product.imagePath}" th:src="@{'/'+${product.imagePath}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'"/>
        <i th:unless="${product.imagePath}" class="bi bi-box text-secondary" style="font-size:2.5rem;"></i>
      </div>
      <h5 th:text="${product.name}" class="fw-700">Product Name</h5>
      <p class="text-muted mb-1" th:text="${product.category.name}">Category</p>
      <span th:classappend="${product.isActive} ? 'badge bg-success' : 'badge bg-secondary'"
            th:text="${product.isActive} ? 'Active' : 'Inactive'">Status</span>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">Product Information</div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-6"><strong>SKU:</strong><br/><code th:text="${product.sku}"></code></div>
          <div class="col-6"><strong>Barcode:</strong><br/><span th:text="${product.barcode ?: '-'}"></span></div>
          <div class="col-6"><strong>Supplier:</strong><br/><span th:text="${product.supplier != null ? product.supplier.name : '-'}"></span></div>
          <div class="col-6"><strong>Unit:</strong><br/><span th:text="${product.unit}"></span></div>
          <div class="col-6"><strong>Buying Price:</strong><br/><span class="text-primary" th:text="'Rs. ' + ${#numbers.formatDecimal(product.buyingPrice, 0, 'COMMA', 2, 'POINT')}"></span></div>
          <div class="col-6"><strong>Selling Price:</strong><br/><span class="text-success fw-600" th:text="'Rs. ' + ${#numbers.formatDecimal(product.sellingPrice, 0, 'COMMA', 2, 'POINT')}"></span></div>
          <div class="col-4">
            <strong>Current Stock:</strong><br/>
            <span th:classappend="${product.quantity <= product.minStockLevel} ? 'badge bg-danger fs-6' : 'badge bg-success fs-6'"
                  th:text="${product.quantity} + ' ' + ${product.unit}"></span>
          </div>
          <div class="col-4"><strong>Min Level:</strong><br/><span th:text="${product.minStockLevel}"></span></div>
          <div class="col-4"><strong>Max Level:</strong><br/><span th:text="${product.maxStockLevel}"></span></div>
          <div class="col-12" th:if="${product.description}">
            <strong>Description:</strong><br/>
            <p class="text-muted mb-0" th:text="${product.description}"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <a th:href="@{'/inventory/product/' + ${product.id}}" class="btn btn-outline-info btn-sm">
        <i class="bi bi-clipboard-data me-1"></i>View Inventory History
      </a>
      <a th:href="@{'/forecasting/product/' + ${product.id}}" class="btn btn-outline-warning btn-sm" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
        <i class="bi bi-graph-up-arrow me-1"></i>View Forecast
      </a>
    </div>
  </div>
</div>
</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
