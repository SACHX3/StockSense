name: Pull Request Check

on:
  pull_request:
    branches: [ main, master ]

jobs:
  quick-check:
    name: Quick PR Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile (catch compilation errors fast)
        working-directory: spring-boot-backend
        run: mvn compile -q --no-transfer-progress

      - name: Run unit tests only (fast — no integration tests)
        working-directory: spring-boot-backend
        run: |
          mvn test \
            -Dspring.profiles.active=test \
            -Dtest="*Test,*Tests" \
            --no-transfer-progress \
            -q

      - name: Comment on PR with result
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Compilation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
